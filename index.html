<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f0e8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="万年历" />
    <title>万年历</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="styles.css?v=20260531-7" />
  </head>
  <body>
    <div class="boot-status" id="bootStatus" role="status">
      <strong>万年历正在启动</strong>
      <span>基础日历数据都在本地，离线也可以打开。</span>
    </div>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>万年历</h1>
        </div>
        <div class="header-actions" aria-label="日历操作">
          <button class="icon-button" id="prevMonth" type="button" title="上个月" aria-label="上个月">
            <span aria-hidden="true">‹</span>
          </button>
          <button class="today-button" id="todayButton" type="button">今天</button>
          <button class="icon-button" id="nextMonth" type="button" title="下个月" aria-label="下个月">
            <span aria-hidden="true">›</span>
          </button>
        </div>
        <button class="settings-button" id="settingsButton" type="button" title="设置" aria-label="设置">⚙</button>
      </header>

      <main class="layout">
        <section class="calendar-panel" aria-label="月份日历">
          <div class="month-toolbar">
            <div class="month-title">
              <button class="icon-button small" id="prevYear" type="button" title="上一年" aria-label="上一年">
                <span aria-hidden="true">«</span>
              </button>
              <div>
                <h2 id="monthTitle"></h2>
                <p id="monthMeta"></p>
              </div>
              <button class="icon-button small" id="nextYear" type="button" title="下一年" aria-label="下一年">
                <span aria-hidden="true">»</span>
              </button>
            </div>

            <div class="selectors">
              <label>
                <span>年份</span>
                <input id="yearInput" type="number" min="1901" max="2100" inputmode="numeric" />
              </label>
              <label>
                <span>月份</span>
                <select id="monthSelect"></select>
              </label>
            </div>
          </div>

          <div class="weekday-grid" aria-hidden="true">
            <span>一</span>
            <span>二</span>
            <span>三</span>
            <span>四</span>
            <span>五</span>
            <span>六</span>
            <span>日</span>
          </div>
          <div class="calendar-grid" id="calendarGrid" role="grid" aria-label="日历日期"></div>

          <section class="history-panel" aria-label="历史上的今天">
            <div class="history-title">
              <h3 id="historyTitle">历史上的今天</h3>
              <p>Today in History</p>
            </div>
            <ul class="history-list" id="historyList"></ul>
          </section>
        </section>

        <aside class="detail-panel" aria-label="日期详情">
          <div class="settings-popover" id="settingsPopover" hidden>
            <div class="settings-popover-head">
              <strong>设置</strong>
              <button id="settingsClose" type="button" aria-label="关闭设置">×</button>
            </div>
            <div class="settings-menu">
              <div class="settings-menu-list" role="menu">
                <button class="is-active" type="button" data-settings-page="components">
                  <span>组件</span>
                  <span aria-hidden="true">›</span>
                </button>
                <button type="button" data-settings-page="donate">
                  <span>捐赠</span>
                  <span aria-hidden="true">›</span>
                </button>
              </div>
              <div class="settings-subpage is-active" data-settings-panel="components">
                <div class="settings-subtitle">组件</div>
                <div class="component-options">
                  <label><input type="checkbox" data-component-toggle="today" /> 今日信息</label>
                  <label><input type="checkbox" data-component-toggle="events" /> 本月节日</label>
                  <label><input type="checkbox" data-component-toggle="redDays" /> 红日子</label>
                  <label><input type="checkbox" data-component-toggle="recommendations" /> 当季推荐</label>
                  <label><input type="checkbox" data-component-toggle="todos" /> 待办提醒</label>
                  <label><input type="checkbox" data-component-toggle="anniversaries" /> 纪念日</label>
                </div>
              </div>
              <div class="settings-subpage donate-page" data-settings-panel="donate">
                <div class="settings-subtitle">捐赠</div>
                <p>如果这个万年历帮到了你，可以请作者喝杯咖啡</p>
                <figure class="donate-code">
                  <img src="assets/donate/alipay.jpg" alt="支付宝收款码" />
                  <figcaption>支付宝扫码支持</figcaption>
                </figure>
                <dl>
                  <div>
                    <dt>作者</dt>
                    <dd>AlanCar</dd>
                  </div>
                  <div>
                    <dt>邮箱</dt>
                    <dd>471075887@qq.com</dd>
                  </div>
                </dl>
              </div>
            </div>
          </div>

          <section class="date-hero">
            <p id="selectedWeekday"></p>
            <div class="selected-day" id="selectedDay"></div>
            <h2 id="selectedSolar"></h2>
            <p id="selectedLunar"></p>
            <div class="almanac-mini" id="almanacMini" aria-label="婚丧嫁娶提示"></div>
          </section>

          <section class="info-section" data-component="today">
            <button class="section-toggle" type="button" data-collapse-toggle="today" aria-expanded="true">
              <span>今日信息</span>
              <span aria-hidden="true">⌄</span>
            </button>
            <dl class="info-list collapsible-body">
              <div>
                <dt>农历</dt>
                <dd id="lunarDetail"></dd>
              </div>
              <div>
                <dt>干支</dt>
                <dd id="ganzhiDetail"></dd>
              </div>
              <div>
                <dt>节日/节气</dt>
                <dd id="festivalDetail"></dd>
              </div>
            </dl>
          </section>

          <section class="info-section" data-component="events">
            <button class="section-toggle" type="button" data-collapse-toggle="events" aria-expanded="true">
              <span>本月节日</span>
              <span aria-hidden="true">⌄</span>
            </button>
            <ul class="event-list collapsible-body" id="monthEvents"></ul>
          </section>

          <section class="info-section" data-component="recommendations">
            <button class="section-toggle" type="button" data-collapse-toggle="recommendations" aria-expanded="true">
              <span>当季推荐</span>
              <span aria-hidden="true">⌄</span>
            </button>
            <div class="season-grid collapsible-body" id="seasonRecommendations"></div>
          </section>

          <section class="info-section" data-component="todos">
            <button class="section-toggle" type="button" data-collapse-toggle="todos" aria-expanded="true">
              <span>待办提醒</span>
              <span aria-hidden="true">⌄</span>
            </button>
            <form class="todo-form collapsible-body" id="todoForm">
              <input id="todoText" type="text" placeholder="添加待办" autocomplete="off" />
              <div class="todo-fields">
                <input id="todoDate" type="date" />
                <input id="todoTime" type="time" />
              </div>
              <label class="setting-row compact">
                <input id="todoReminder" type="checkbox" />
                <span>到时提醒</span>
              </label>
              <button class="todo-add" type="submit">添加</button>
            </form>
            <ul class="todo-list collapsible-body" id="todoList"></ul>
          </section>

          <section class="info-section" data-component="anniversaries">
            <button class="section-toggle" type="button" data-collapse-toggle="anniversaries" aria-expanded="true">
              <span>纪念日</span>
              <span aria-hidden="true">⌄</span>
            </button>
            <form class="anniversary-form collapsible-body" id="anniversaryForm">
              <input id="anniversaryName" type="text" placeholder="纪念日名称" autocomplete="off" />
              <div class="anniversary-type" role="radiogroup" aria-label="纪念日类型">
                <label><input type="radio" name="anniversaryType" value="solar" checked /> 阳历</label>
                <label><input type="radio" name="anniversaryType" value="lunar" /> 阴历</label>
              </div>
              <div class="anniversary-fields">
                <input id="anniversarySolarDate" type="date" />
                <div class="lunar-date-fields" id="anniversaryLunarFields" hidden>
                  <select id="anniversaryLunarMonth" aria-label="阴历月份"></select>
                  <select id="anniversaryLunarDay" aria-label="阴历日期"></select>
                </div>
              </div>
              <button class="todo-add" type="submit">添加纪念日</button>
            </form>
            <ul class="anniversary-list collapsible-body" id="anniversaryList"></ul>
          </section>
        </aside>
      </main>
    </div>
    <div class="reminder-toast" id="reminderToast" role="status" aria-live="polite" hidden>
      <div>
        <strong>待办提醒</strong>
        <span id="reminderToastText"></span>
      </div>
      <button id="reminderToastClose" type="button" aria-label="关闭提醒">×</button>
    </div>

    <script src="app.js?v=20260531-7" defer></script>
  </body>
</html>
